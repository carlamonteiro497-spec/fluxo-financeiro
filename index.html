<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxo Financeiro</title>
<meta name="theme-color" content="#1e40af">
<meta name="description" content="Aplicação de rastreamento financeiro com calendário, contas fixas e despesas variáveis">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F5F3EC;
  --paper-raised: #FFFFFF;
  --ink: #1E2019;
  --ink-soft: #686A5E;
  --ink-faint: #A9AA9C;
  --line: rgba(30,32,25,0.12);
  --line-strong: rgba(30,32,25,0.20);
  --accent: #35467A;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(53,70,122,0.10);
  --danger: #B23A2F;
  --danger-soft: rgba(178,58,47,0.12);
  --shadow: 0 1px 2px rgba(30,32,25,0.06), 0 8px 24px -12px rgba(30,32,25,0.18);
  --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { width: 100%; overflow-x: hidden; }
body {
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--paper);
  color: var(--ink);
  padding: 8px;
  font-weight: 400;
  letter-spacing: 0.3px;
}
@media (min-width: 480px) { body { padding: 16px; } }
.container { max-width: 100%; margin: 0 auto; overflow-x: hidden; width: 100%; }
@media (min-width: 768px) { .container { max-width: 900px; } }
.header {
  background: linear-gradient(135deg, #1e40af 0%, #0369a1 50%, #0891b2 100%);
  color: white;
  padding: 16px 12px;
  border-radius: 16px;
  margin-bottom: 24px;
  box-shadow: 0 10px 30px rgba(30, 64, 175, 0.2);
  position: relative;
}
.header-content { display: flex; align-items: center; gap: 16px; }
.header-logo { width: 80px; height: 80px; flex-shrink: 0; }
.header h1 { font-size: 18px; margin: 0 0 4px 0; font-weight: 700; }
.header-subtitle { font-size: 12px; opacity: 0.95; margin: 0; }
.tabs { display: flex; margin-bottom: 20px; background: var(--paper-raised); border-radius: 12px 12px 0 0; }
.tab-btn {
  flex: 1; padding: 10px 6px; border: none; background: none; color: var(--ink-soft);
  font-weight: 500; cursor: pointer; border-bottom: 3px solid transparent; font-size: 12px;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; background: var(--paper-raised); border-radius: 0 0 12px 12px; padding: 20px; box-shadow: var(--shadow); }
.tab-content.active { display: block; }
.flow-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.flow-box { background: var(--paper); border-radius: 12px; padding: 16px; text-align: center; border: 2px solid var(--line); }
.flow-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
.flow-value { font-size: 20px; font-weight: 700; color: var(--ink); }
.summary-card, .quick-add { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
#addForm { display: flex; flex-direction: column; gap: 14px; }
.value-field { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line-strong); padding-bottom: 8px; }
.currency-prefix { font-family: "IBM Plex Mono", monospace; font-size: 22px; color: var(--ink-faint); }
#valueInput { border: none; background: none; outline: none; font-family: "IBM Plex Mono", monospace; font-size: 30px; font-weight: 600; color: var(--ink); width: 100%; }
.desc-input, .date-input { font-family: inherit; font-size: 15px; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; outline: none; }
.row-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { display: flex; align-items: center; justify-content: space-between; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.stepper button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--paper-raised); cursor: pointer; }
.submit-btn { font-family: inherit; font-size: 15.5px; font-weight: 600; color: var(--accent-ink); background: var(--accent); border: none; border-radius: 10px; padding: 13px; cursor: pointer; }
.entry { background: var(--paper-raised); border: 1px solid var(--line); border-left: 3px solid var(--line-strong); border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal-content { background: var(--paper-raised); border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-content">
      <div class="header-text">
        <h1>Fluxo Financeiro</h1>
        <p class="header-subtitle">Construindo o nosso futuro juntos[cite: 2].</p>
      </div>
    </div>
    <div style="display: flex; justify-content: flex-end; margin-top: 12px;">
      <span id="syncStatus" style="font-size: 12px; color: rgba(255,255,255,0.85);">⏳ Conectando à nuvem...</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('resumo')">📊 Resumo</button>
    <button class="tab-btn" onclick="switchTab('despesas')">🧾 Passou, Anotou</button>
  </div>

  <!-- RESUMO -->
  <div id="resumo" class="tab-content active">
    <div class="flow-section">
      <div class="flow-box">
        <div class="flow-label">Total de Gastos do Mês</div>
        <div class="flow-value" id="summaryTotal">R$ 0,00</div>
      </div>
    </div>
  </div>

  <!-- DESPESAS -->
  <div id="despesas" class="tab-content">
    <div class="quick-add">
      <form id="addForm">
        <div class="value-field">
          <span class="currency-prefix">R$</span>
          <input id="valueInput" inputmode="numeric" placeholder="0,00">
        </div>
        <input id="descInput" class="desc-input" type="text" placeholder="Onde foi?">
        <div class="row-fields">
          <div>
            <label style="font-size: 11.5px; color: var(--ink-soft);">Parcelas</label>
            <div class="stepper">
              <button type="button" id="instMinus">−</button>
              <span id="instValue" style="font-family:'IBM Plex Mono'; font-weight:600;">1x</span>
              <button type="button" id="instPlus">+</button>
            </div>
          </div>
          <div>
            <label style="font-size: 11.5px; color: var(--ink-soft);">Data</label>
            <input id="dateInput" class="date-input" type="text" placeholder="DD/MM/AAAA">
          </div>
        </div>
        <button type="submit" class="submit-btn" style="margin-top: 10px;">Registrar gasto</button>
      </form>
    </div>
    <div class="ledger" id="ledger" style="margin-top: 20px;"></div>
  </div>
</div>

<!-- Biblioteca SheetJS para planilhas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  // CONFIGURAÇÃO AUTOMÁTICA DO SUPABASE (Já embutida para sincronizar sozinha)
  const SUPABASE_URL = "https://nklszryrglsrzsgkyzob.supabase.co";
  const SUPABASE_KEY = "sb_publishable_NQd9TQurcr-w20Z1YUi6Qw_gnUdQ7d5"; // Insira aqui sua chave Anon real do Supabase que está no seu .env.example

  let state = {
    expenses: [],
    viewYear: new Date().getFullYear(),
    viewMonth: new Date().getMonth(),
    installments: 1
  };

  const pad2 = n => n < 10 ? '0' + n : '' + n;
  const todayISO = () => {
    const d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  };
  const formatCentsBRL = cents => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format((cents || 0) / 100);

  // SINCRONIZAÇÃO AUTOMÁTICA COM O SUPABASE EM SEGUNDO PLANO
  async function syncToSupabaseAuto() {
    if (!SUPABASE_URL || SUPABASE_KEY === "sua_chave_aqui") {
      document.getElementById('syncStatus').textContent = '⚠️ Configure a Chave Supabase no código';
      return;
    }
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/expenses`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'apikey': SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify(state.expenses.map(e => ({
          id: e.id,
          date: e.date,
          description: e.description,
          valuecents: e.valueCents,
          installments: e.installments,
          createdat: e.createdAt || new Date().toISOString()
        })))
      });
      if (response.ok) {
        document.getElementById('syncStatus').textContent = '✅ Sincronizado na nuvem';
      }
    } catch (e) {
      document.getElementById('syncStatus').textContent = '📴 Modo offline (salvo local)';
    }
  }

  async function loadFromSupabaseAuto() {
    if (!SUPABASE_URL || SUPABASE_KEY === "sua_chave_aqui") return;
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/expenses?order=created_at.asc`, {
        headers: {
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'apikey': SUPABASE_KEY,
          'Content-Type': 'application/json'
        }
      });
      if (response.ok) {
        const cloudData = await response.json();
        if (cloudData && cloudData.length > 0) {
          state.expenses = cloudData.map(e => ({
            id: e.id,
            date: e.date,
            description: e.description,
            valueCents: e.valuecents || e.valueCents || 0,
            installments: e.installments || 1,
            createdAt: e.createdat || e.createdAt
          }));
          renderAll();
        }
      }
    } catch (e) {}
  }

  // CORREÇÃO DO PARCELAMENTO (Trava estritamente no número escolhido, evitando o bug de 10x virar 30x)
  const purchaseOccurrences = e => {
    const n = Math.max(1, parseInt(e.installments, 10) || 1);
    const base = Math.floor(e.valueCents / n);
    const remainder = e.valueCents - base * n;
    const occs = [];
    const baseDate = e.date || todayISO();

    for (let i = 0; i < n; i++) {
      let parts = baseDate.split('-').map(Number);
      let targetMonth = parts[1] - 1 + i;
      let targetYear = parts[0] + Math.floor(targetMonth / 12);
      targetMonth = targetMonth % 12;
      let dateFormatted = targetYear + '-' + pad2(targetMonth + 1) + '-' + pad2(parts[2]);

      occs.push({
        occId: e.id + '#' + i,
        expenseId: e.id,
        index: i + 1,
        installments: n, // Garante que o total de parcelas permanece fixo
        valueCents: base + (i < remainder ? 1 : 0),
        description: e.description,
        purchaseDate: e.date,
        date: dateFormatted
      });
    }
    return occs;
  };

  const allOccurrences = () => {
    let out = [];
    state.expenses.forEach(e => out = out.concat(purchaseOccurrences(e)));
    return out;
  };

  const renderLedger = () => {
    const ledgerEl = document.getElementById('ledger');
    ledgerEl.innerHTML = '';
    if (state.expenses.length === 0) {
      ledgerEl.innerHTML = '<div style="text-align:center; padding:20px; color:var(--ink-soft);">Nenhum gasto registrado.</div>';
      return;
    }
    state.expenses.slice().reverse().forEach(e => {
      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `<div><strong>${e.description}</strong><br><small>${e.installments}x de formatado</small></div>
                       <div style="font-weight:bold; font-family:'IBM Plex Mono';">${formatCentsBRL(e.valueCents)}</div>`;
      ledgerEl.appendChild(div);
    });
  };

  const renderAll = () => {
    renderLedger();
    let total = 0;
    allOccurrences().forEach(o => total += o.valueCents);
    document.getElementById('summaryTotal').textContent = formatCentsBRL(total);
  };

  // Eventos do formulário
  document.getElementById('instMinus').addEventListener('click', () => {
    if (state.installments > 1) { state.installments--; document.getElementById('instValue').textContent = state.installments + 'x'; }
  });
  document.getElementById('instPlus').addEventListener('click', () => {
    if (state.installments < 24) { state.installments++; document.getElementById('instValue').textContent = state.installments + 'x'; }
  });

  document.getElementById('valueInput').addEventListener('input', (e) => {
    let digits = e.target.value.replace(/\D/g, '');
    e.target.value = digits ? (parseInt(digits, 10) / 100).toLocaleString('pt-BR', {minimumFractionDigits: 2}) : '';
    e.target.setAttribute('data-cents', digits || '0');
  });

  document.getElementById('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const cents = parseInt(document.getElementById('valueInput').getAttribute('data-cents') || '0', 10);
    const desc = document.getElementById('descInput').value.trim();
    if (cents <= 0 || !desc) { alert('Preencha o valor e a descrição'); return; }

    const newExpense = {
      id: 'exp_' + Date.now() + Math.random().toString(36).substr(2, 4),
      valueCents: cents,
      description: desc,
      installments: state.installments,
      date: todayISO(),
      createdAt: new Date().toISOString()
    };

    state.expenses.push(newExpense);
    
    // SALVA LOCAL E DISPARA SINCRONIZAÇÃO AUTOMÁTICA IMEDIATA
    localStorage.setItem('fluxo_expenses', JSON.stringify(state.expenses));
    renderAll();
    syncToSupabaseAuto();

    document.getElementById('valueInput').value = '';
    document.getElementById('descInput').value = '';
    state.installments = 1;
    document.getElementById('instValue').textContent = '1x';
  });

  window.switchTab = (tab) => {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    event.target.classList.add('active');
  };

  // Inicialização
  const localData = localStorage.getItem('fluxo_expenses');
  if (localData) {
    try { state.expenses = JSON.parse(localData); } catch(e){}
  }
  renderAll();
  loadFromSupabaseAuto(); // Puxa da nuvem automaticamente ao abrir
})();
</script>
</body>
</html>
