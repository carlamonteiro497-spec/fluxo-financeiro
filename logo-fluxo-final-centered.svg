<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#gradient)" filter="url(#shadow)"/>

  <!-- Decorative coin/money circle on top right -->
  <circle cx="155" cy="45" r="18" fill="rgba(255,255,255,0.2)"/>
  <circle cx="155" cy="45" r="12" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <text x="155" y="50" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-weight="bold">$</text>

  <!-- Circle around CI - centered -->
  <circle cx="100" cy="100" r="48" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>

  <!-- Main initials C & I - perfectly centered inside circle -->
  <g>
    <!-- C initial -->
    <text x="80" y="108" font-size="72" font-weight="300" fill="rgba(255,255,255,0.95)" font-family="Georgia, serif" letter-spacing="-5" text-anchor="middle" dominant-baseline="middle">C</text>

    <!-- I initial -->
    <text x="120" y="108" font-size="72" font-weight="700" fill="rgba(255,255,255,0.95)" font-family="Georgia, serif" letter-spacing="5" text-anchor="middle" dominant-baseline="middle">I</text>
  </g>
</svg>
