<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo Financeiro - Real-time</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            background: linear-gradient(135deg, #1e5a96 0%, #2a7bb4 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo { font-size: 32px; font-weight: bold; }
        h1 { font-size: 24px; }

        .status {
            background: rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        .status.connected { background: #4CAF50; }
        .status.disconnected { background: #F44336; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #1e5a96;
        }

        .card-label { font-size: 12px; color: #999; text-transform: uppercase; margin-bottom: 8px; }
        .card-value { font-size: 24px; font-weight: bold; color: #1e5a96; }

        .transactions-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .transactions-section h2 { margin-bottom: 20px; font-size: 18px; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid #eee;
            font-weight: 600;
            font-size: 12px;
            color: #666;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        table tr:hover { background: #f9f9f9; }

        .loading { text-align: center; padding: 40px; color: #999; }

        .sync-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 12px;
            display: none;
        }

        .sync-indicator.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="logo">💰</div>
                <div>
                    <h1>Fluxo Financeiro</h1>
                    <p>Sincronização em Tempo Real</p>
                </div>
            </div>
            <div class="status" id="status">Conectando...</div>
        </header>

        <div class="cards-grid" id="cards-container">
            <div class="loading">Carregando dados...</div>
        </div>

        <div class="transactions-section">
            <h2>Transações</h2>
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Valor</th>
                        <th>Vencimento</th>
                    </tr>
                </thead>
                <tbody id="transactions-table">
                    <tr><td colspan="5" class="loading">Carregando transações...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="sync-indicator" id="sync-indicator">✓ Sincronizado</div>

    <script>
        // Inicializar Supabase
        const SUPABASE_URL = 'https://nklszryrglsrzsgkyzob.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NQd9TQrccr=z0Z1Y1U6Qw_gnUdQ7d5';

        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let transactions = [];
        let categories = [];

        // ============================================
        // INICIALIZAÇÃO
        // ============================================

        async function init() {
            try {
                // Conectar ao Supabase
                updateStatus('Conectando...', false);

                // Carregar categorias
                await loadCategories();

                // Carregar transações
                await loadTransactions();

                // Setup real-time listeners
                setupRealtimeListeners();

                updateStatus('Conectado', true);
            } catch (err) {
                console.error('Erro:', err);
                updateStatus('Erro na conexão', false);
            }
        }

        // ============================================
        // CARREGAR DADOS
        // ============================================

        async function loadCategories() {
            const { data, error } = await supabase
                .from('categories')
                .select('*');

            if (error) throw error;
            categories = data || [];
        }

        async function loadTransactions() {
            const { data, error } = await supabase
                .from('transactions')
                .select('*')
                .order('transaction_date', { ascending: false });

            if (error) throw error;
            transactions = data || [];
            renderUI();
        }

        // ============================================
        // REAL-TIME LISTENERS
        // ============================================

        function setupRealtimeListeners() {
            // Listener para transações
            supabase
                .channel('transactions-channel')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'transactions' },
                    (payload) => {
                        console.log('Transação atualizada:', payload);
                        loadTransactions();
                        showSyncIndicator();
                    }
                )
                .subscribe();

            // Listener para categorias
            supabase
                .channel('categories-channel')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'categories' },
                    (payload) => {
                        console.log('Categoria atualizada:', payload);
                        loadCategories();
                    }
                )
                .subscribe();
        }

        // ============================================
        // RENDERIZAR UI
        // ============================================

        function renderUI() {
            renderCards();
            renderTransactionsTable();
        }

        function renderCards() {
            // Calcular totais por categoria
            const summary = {};
            const categoryMap = {};

            categories.forEach(cat => {
                categoryMap[cat.id] = cat;
                summary[cat.id] = { name: cat.name, total: 0 };
            });

            transactions.forEach(t => {
                if (summary[t.category_id]) {
                    summary[t.category_id].total += t.type === 'expense' ? -t.amount : t.amount;
                }
            });

            // Renderizar cards
            const cardsHTML = Object.values(summary)
                .map(cat => `
                    <div class="card">
                        <div class="card-label">${cat.name}</div>
                        <div class="card-value">${formatCurrency(cat.total)}</div>
                    </div>
                `)
                .join('');

            document.getElementById('cards-container').innerHTML = cardsHTML;
        }

        function renderTransactionsTable() {
            const tbody = document.getElementById('transactions-table');

            if (transactions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="loading">Nenhuma transação</td></tr>';
                return;
            }

            tbody.innerHTML = transactions
                .map(t => {
                    const category = categories.find(c => c.id === t.category_id);
                    return `
                        <tr>
                            <td>${formatDate(t.transaction_date)}</td>
                            <td>${t.description}</td>
                            <td>${category?.name || 'N/A'}</td>
                            <td>${formatCurrency(t.type === 'expense' ? -t.amount : t.amount)}</td>
                            <td>${t.due_date ? formatDate(t.due_date) : '-'}</td>
                        </tr>
                    `;
                })
                .join('');
        }

        // ============================================
        // UTILITÁRIOS
        // ============================================

        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('pt-BR');
        }

        function updateStatus(text, connected) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = `status ${connected ? 'connected' : 'disconnected'}`;
        }

        function showSyncIndicator() {
            const indicator = document.getElementById('sync-indicator');
            indicator.classList.add('show');
            setTimeout(() => indicator.classList.remove('show'), 2000);
        }

        // Iniciar
        init();
    </script>
</body>
</html>
