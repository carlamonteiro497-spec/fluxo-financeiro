<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo Financeiro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e40af 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 80px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 80px 60px;
            box-shadow: 0 30px 100px rgba(0,0,0,0.3);
            max-width: 520px;
            width: 95%;
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 { font-size: 36px; font-weight: 800; color: #0f172a; margin: 0 0 10px; }
        .subtitle { font-size: 16px; color: #64748b; margin: 0 0 40px; }
        button {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-4px); box-shadow: 0 12px 35px rgba(30,64,175,0.35); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .hint { font-size: 13px; color: #94a3b8; margin: 16px 0 0; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 80px; margin-bottom: 20px;">💰</div>
        <h1>Fluxo Financeiro</h1>
        <p class="subtitle">Gerencie suas finanças em qualquer lugar</p>
        <button id="loginBtn">🔐 Entrar com Google</button>
        <p class="hint">Sincronização automática entre devices</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://nklszryrglsrzsgkyzob.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_NQd9TQurcr-w20Z1YUi6Qw_gnUdQ7d5';

        let supabase = null;
        const loginBtn = document.getElementById('loginBtn');

        // Inicializar Supabase
        function initSupabase() {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✓ Supabase inicializado');
                setupLoginButton();
                checkAuthStatus();
            } catch (error) {
                console.error('❌ Erro ao inicializar Supabase:', error);
                loginBtn.textContent = '❌ Erro ao carregar';
                loginBtn.disabled = true;
            }
        }

        // Configurar botão de login
        function setupLoginButton() {
            loginBtn.addEventListener('click', async () => {
                loginBtn.disabled = true;
                loginBtn.textContent = '⏳ Carregando Google...';

                try {
                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin + window.location.pathname
                        }
                    });

                    if (error) {
                        console.error('Erro OAuth:', error);
                        loginBtn.textContent = '🔐 Entrar com Google';
                        loginBtn.disabled = false;
                        alert('Erro: ' + error.message);
                    }
                } catch (err) {
                    console.error('Erro ao fazer login:', err);
                    loginBtn.textContent = '🔐 Entrar com Google';
                    loginBtn.disabled = false;
                    alert('Erro ao fazer login');
                }
            });
        }

        // Verificar se já está autenticado
        async function checkAuthStatus() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session?.user) {
                    console.log('✓ Usuário autenticado:', session.user.email);
                    loginBtn.textContent = '✓ Autenticado como: ' + session.user.email;
                    loginBtn.disabled = true;
                    // Aqui você pode carregar a interface real
                }
            } catch (error) {
                console.error('Erro ao verificar autenticação:', error);
            }
        }

        // Aguardar Supabase carregar
        if (typeof window.supabase !== 'undefined') {
            initSupabase();
        } else {
            const maxAttempts = 10;
            let attempts = 0;
            const checkInterval = setInterval(() => {
                attempts++;
                if (typeof window.supabase !== 'undefined') {
                    clearInterval(checkInterval);
                    initSupabase();
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.error('❌ Supabase SDK não carregou');
                    loginBtn.textContent = '❌ Erro: SDK não carregou';
                    loginBtn.disabled = true;
                }
            }, 500);
        }
    </script>
</body>
</html>
